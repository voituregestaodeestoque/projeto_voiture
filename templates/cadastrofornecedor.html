{% extends 'base.html' %}

{% block conteudo %}


<!--Fornecedor-->

<div id="template_fornecedor">

    <!-- TÍTULO + BOTÃO -->

    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h2 style="margin-left: 5px;margin-bottom: 10px;">Cadastro de Fornecedor</h2>
        </div>

        <div>
            <a href="{{ url_for('listagem_fornecedor') }}" class="btn btn-success">
            <i></i>Visualizar fornecedores</a>
        </div>

    </div>


    <!--Formulário para cadastro de fornecedor-->

    <form id="form_fornecedor" action="{{ url_for('salvar_fornecedor')}}" method="POST">

        <div class="row">
            <div class="col-md-6 mb-3">

                <!--Campo Nome-->
                <label for="fornecedor_nome" class="form-label">Nome</label>
                <div class="input-group">
                    <span class="input-group-text bg-dark border-secondary">
                        <i class="bi bi-person-fill text-white"></i>
                    </span>
                    <input name="fornecedor_nome" type="text" class="form-control" id="fornecedor_nome" placeholder="Nome do Representante" required>
                </div>
                
            </div>


            <div class="col-md-6 mb-3">

                <!--Campo CNPJ-->
                <label for="fornecedor_cnpj" class="form-label">CNPJ</label>
                <div class="input-group">
                    <span class="input-group-text bg-dark border-secondary">
                        <i class="bi bi-person-vcard-fill text-white"></i>
                    </span>
                    <input name="fornecedor_cnpj" type="text" class="form-control" id="fornecedor_cnpj" placeholder="00.000.000/0000-00" maxlength="18"
                    inputmode="numeric" oninput="formatarCNPJ(this)" required>
                </div>
            </div>

            <div class="col-md-6 mb-3">

                <!--Campo CEP-->
                <label for="fornecedor_cep" class="form-label">CEP</label>
                <div class="input-group">
                    <span class="input-group-text bg-dark border-secondary">
                        <i class="bi bi-geo-alt text-white"></i>
                    </span>
                    <input name="fornecedor_cep" type="number" class="form-control" id="fornecedor_cep" placeholder="00000-000" required>
                </div>
            </div>

            <div class="col-md-6 mb-3">

                <!--Campo Email-->
                <label for="fornecedor_email" class="form-label">Email</label>
                <div class="input-group">
                    <span class="input-group-text bg-dark border-secondary">
                        <i class="bi bi-envelope text-white"></i>
                    </span>
                    <input name="fornecedor_email" type="email" class="form-control" id="fornecedor_email" placeholder="Email de Contato" required >
                </div>
            </div>

            <div class="col-md-3 mb-3">

                <!--Campo DDI-->
                <label for="fornecedor_ddi" class="form-label">DDI</label>
                <div class="input-group">
                    <span class="input-group-text bg-dark border-secondary">
                        <i class="bi bi-telephone-fill text-white"></i>
                    </span>
                    <input name="fornecedor_ddi" type="number" class="form-control" id="fornecedor_ddi" placeholder="Código Internacional" required >
                </div>
            </div>

            <div class="col-md-3 mb-3">

                <!--Campo DDD-->
                <label for="fornecedor_ddd" class="form-label">DDD</label>
                <div class="input-group">
                    <span class="input-group-text bg-dark border-secondary">
                        <i class="bi bi-telephone-fill text-white"></i>
                    </span>
                    <input name="fornecedor_ddd" type="number" class="form-control" id="fornecedor_ddd" placeholder="Código Regional" required>
                </div>
            </div>

            <div class="col-md-6 mb-3">

                <!--Campo Telefone-->
                <label for="fornecedor_telefone" class="form-label">Telefone</label>
                <div class="input-group">
                    <span class="input-group-text bg-dark border-secondary">
                        <i class="bi bi-telephone-fill text-white"></i>
                    </span>
                    <input name="fornecedor_telefone" type="tel" class="form-control" id="fornecedor_telefone" placeholder="Telefone de Contato" required >
                </div>
            </div>

            <div class="mb-3">

                <!--Campo Descrição-->
                <label for="fornecedor_descricao" class="form-label">Descrição</label>
                <textarea name="fornecedor_descricao" class="form-control" id="exampleFormControlTextarea1" rows="3"></textarea>
            </div>

        </div>

        <div id="btn-fornecedor">

            <!--Botão que envia o formulário-->
            <button type="submit" class="btn btn-primary">Cadastrar</button>
        </div>


    </form>

</div>



{% endblock %}
