<!DOCTYPE html>

<html lang="pt-br">

<head>

    <!-- Configurações da página -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Voiture - Gestão de Estoque</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Ícones -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">

    <!-- CSS do projeto -->
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

    <!-- Favicon -->
    <link rel="shortcut icon"
          href="{{ url_for('static', filename='favicons do voiture/favicon.ico') }}"
          type="image/x-icon">

</head>

<!-- Corpo da página e estilização do fundo -->
<body
    style="background-color: #151515;
    background-image: repeating-linear-gradient(45deg,
        rgba(255, 255, 255, 0.05) 0px,
        rgba(255, 255, 255, 0.05) 2px,
        transparent 3px,
        transparent 7px);
        color: #eef0f3;
        min-height: 100vh;
        display: flex;
        align-items: center;"
    aria-labelledby="titulo-erro-404">

    <!-- Conteúdo principal do erro 404 -->
    <main
        class="container text-center"
        aria-labelledby="titulo-erro-404"
        aria-describedby="descricao-erro-404">

        <!-- Organização do conteúdo -->
        <div class="row justify-content-center">

            <div class="col-12 col-md-6">

                <!-- Código do erro -->
                <span
                    class="badge-code badge rounded-pill px-3 py-2 mb-4 d-inline-block"
                    style="border: 1px solid #343a40;color: #2ba1cc;"
                    aria-label="Código do erro 404">

                    ERRO 404

                </span>

                <!-- Título da página -->
                <h1
                    id="titulo-erro-404"
                    class="display-4">

                    Página não encontrada

                </h1>

                <!-- Descrição para acessibilidade -->
                <p
                    id="descricao-erro-404"
                    class="visually-hidden">

                    A página que você tentou acessar não foi encontrada.

                </p>

                <!-- Botão para voltar -->
                <a
                    href="{{ url_for('loginfuncionario')}}"
                    class="btn btn-accent px-4 py-2"
                    aria-label="Voltar ao início e acessar a tela de login">

                    Voltar ao início

                </a>

            </div>

        </div>

    </main>

</body>

</html>
