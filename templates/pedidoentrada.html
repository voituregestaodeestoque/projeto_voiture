<script>
    let itens = [];
    
    // 🔹 Adicionar item na lista
    function adicionarItem() {
        const produtoInput = document.getElementById("pedidoentrada_produto");
        const quantidadeInput = document.getElementById("pedidoentrada_quantidade");
    
        const produto = produtoInput.value.trim();
        const quantidade = quantidadeInput.value.trim();
    
        if (!produto || !quantidade) {
            alert("Preencha produto e quantidade");
            return;
        }
    
        if (parseInt(quantidade) <= 0) {
            alert("Quantidade inválida");
            return;
        }
    
        const item = {
            produto: produto,
            quantidade: parseInt(quantidade)
        };
    
        itens.push(item);
    
        // limpa campos
        produtoInput.value = "";
        quantidadeInput.value = "";
    
        renderizarLista();
    }
    
    // 🔹 Renderizar tabela
    function renderizarLista() {
        const lista = document.getElementById("listaItens");
        lista.innerHTML = "";
    
        itens.forEach((item, index) => {
            lista.innerHTML += `
                <tr>
                    <td>${item.produto}</td>
                    <td>${item.quantidade}</td>
                    <td>
                        <button class="btn btn-danger btn-sm" onclick="removerItem(${index})">
                            Remover
                        </button>
                    </td>
                </tr>
            `;
        });
    }
    
    // 🔹 Remover item
    function removerItem(index) {
        itens.splice(index, 1);
        renderizarLista();
    }
    
    // 🔹 Enviar pedido pro backend
    function enviarPedido() {
        const fornecedor = document.getElementById("pedidoentrada_fornecedor").value.trim();
    
        if (!fornecedor) {
            alert("Informe o fornecedor");
            return;
        }
    
        if (itens.length === 0) {
            alert("Adicione pelo menos um item");
            return;
        }
    
        const payload = {
            fornecedor: fornecedor,
            itens: itens
        };
    
        fetch("/cadastrar_pedidoentrada_lote", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify(payload)
        })
        .then(response => response.json())
        .then(data => {
            alert(data.mensagem);
    
            // reset
            itens = [];
            renderizarLista();
            document.getElementById("pedidoentrada_fornecedor").value = "";
        })
        .catch(error => {
            console.error(error);
            alert("Erro ao enviar pedido");
        });
    }
    </script>
