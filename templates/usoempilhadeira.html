{% extends 'base.html' %}

{% block conteudo %}

<!-- Container principal da página -->
<div id="template_uso_empilhadeira">


<!--título-->

<!-- Cabeçalho com título e botão de visualização -->
<div class="d-flex justify-content-between align-items-center mb-4">

    <div>

        <!-- Título da página -->
        <h2 class="titulo-pagina" id="titulo-uso-empilhadeira">

            <i class="bi bi-tools" aria-hidden="true"></i>

            Uso de empilhadeira

            <!--se passarem um id, o titulo vira outro-->

        </h2>

    </div>

    <div>

        <!--rota para ir visualizar as empilhadeiras já cadastradas-->

        <!-- Botão para visualizar as empilhadeiras cadastradas -->
        <a href="{{ url_for('tabelaempilhadeira') }}"
            class="btn btn-success"
            aria-label="Visualizar empilhadeiras cadastradas">

            <i aria-hidden="true"></i>Visualizar Empilhadeiras

        </a>

    </div>

</div>

<!-- Formulário para registrar o uso da empilhadeira -->
<form action="{{ url_for('salvar_uso_empilhadeira')}}"
    method="POST"
    aria-labelledby="titulo-uso-empilhadeira">

    <!--Div pai-->

    <!-- Área que organiza os campos do formulário -->
    <div class="row">

        <!--coluna-->

        <!-- Campo para selecionar o funcionário -->
        <div class="col-md-6 mb-3" style="width: 50%;">

            <!--nome do campo option -->

            <!-- Nome do campo -->
            <label for="funcionario_id" class="form-label">
                Funcionário
            </label>

            <div class="input-group" style="width: 100%;">

                <span class="input-group-text bg-dark border-secondary"
                    aria-hidden="true">

                    <!--icone BS-->

                    <!-- Ícone do funcionário -->
                    <i class="bi bi-person-fill text-white"
                        aria-hidden="true"></i>

                </span>

                <!--campo option + importação do nome e id do funcionário existente-->

                <!-- Seleção dos funcionários cadastrados -->
                <select id="funcionario_id"
                    name="funcionario_id"
                    class="form-select"
                    aria-label="Selecionar funcionário"
                    aria-required="true">

                    <option value="">Selecione</option>

                    <!-- Percorre os funcionários cadastrados -->
                    {% for funcionario in funcionarios %}

                    <option value="{{ funcionario.id }}">

                        {{ funcionario.funcionario_nome }} | ID {{ funcionario.id }}

                    </option>

                    {% endfor %}

                </select>

            </div>

        </div>

        <!--coluna + noma do campo option-->

        <!-- Campo para selecionar a empilhadeira -->
        <div class="col-md-6 mb-3 w-50">

            <label for="empilhadeira_id" class="form-label">
                Empilhadeira
            </label>

            <div class="input-group" style="width: 100%;">

                <!--icone BS-->

                <!-- Ícone da empilhadeira -->
                <span class="input-group-text bg-dark border-secondary"
                    aria-hidden="true">

                    <i class="bi bi-tools text-white"
                        aria-hidden="true"></i>

                </span>

                <!--campo option + importação do chassi, marca, modelo e id de uma empilhadeira existente-->

                <!-- Seleção das empilhadeiras cadastradas -->
                <select id="empilhadeira_id"
                    name="empilhadeira_id"
                    class="form-select"
                    aria-label="Selecionar empilhadeira"
                    aria-required="true">

                    <option value="">Selecione</option>

                    <!-- Percorre as empilhadeiras cadastradas -->
                    {% for empilhadeira in empilhadeiras %}

                    <option value="{{ empilhadeira.id }}">

                        ID {{ empilhadeira.id }} |
                        Modelo {{ empilhadeira.empilhadeira_modelo }} |
                        Marca: {{ empilhadeira.empilhadeira_marca }}

                    </option>

                    {% endfor %}

                </select>

            </div>

        </div>

        <!--Botao-->

        <!-- Área do botão de registro -->
        <div class=" botao-direita">

            <!-- Botão para registrar o uso -->
            <button type="submit"
                class="btn botao-add"
                aria-label="Registrar uso da empilhadeira">

                Registrar

            </button>

        </div>

    </div>

</form>


</div>

{% endblock %}
